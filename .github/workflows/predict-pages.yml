name: Predict T Deck and deploy Pages

on:
  workflow_run:
    workflows: ["Collect T Deck parking data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'model/phase3/**'
      - 'site/**'
      - '.github/workflows/predict-pages.yml'
  schedule:
    - cron: '2,17,32,47 * * * *'

permissions:
  contents: read

concurrency:
  group: tdeck-prediction-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Used only by the explicitly activated data-only model-state writer.
      contents: write
      pages: read
    steps:
      # Read trusted default-branch source and the latest CSV together.
      # Never execute code/download artifacts from the triggering workflow run.
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify predictor and service states
        run: python -m unittest discover -s model/phase3/tests -v
      - name: Verify frontend service states
        run: node --test model/phase3/tests/state.test.mjs
      - name: Read online activation mode
        id: online_mode
        run: |
          python -c "import json,os; mode=json.load(open('model/phase3/online_config.json'))['mode']; assert mode in ['off','shadow','production']; open(os.environ['GITHUB_OUTPUT'],'a').write('mode='+mode+'\n')"
      # Phase B default is off. These steps cannot initialize state, change
      # environments, promote the candidate, or dispatch another workflow.
      - name: Restore compatible online checkpoint
        id: restore_online
        timeout-minutes: 1
        if: steps.online_mode.outputs.mode == 'shadow' || steps.online_mode.outputs.mode == 'production'
        continue-on-error: ${{ steps.online_mode.outputs.mode == 'shadow' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python model/phase3/state_remote.py restore --state .online-artifacts/online_state.json
      - name: Learn from new observations only
        id: learn_online
        timeout-minutes: 1
        if: steps.restore_online.outcome == 'success'
        continue-on-error: ${{ steps.online_mode.outputs.mode == 'shadow' }}
        run: python model/phase3/update_online.py --state .online-artifacts/online_state.json
      - name: Commit online checkpoint with conflict protection
        id: save_online
        timeout-minutes: 1
        if: steps.learn_online.outcome == 'success'
        continue-on-error: ${{ steps.online_mode.outputs.mode == 'shadow' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python model/phase3/state_remote.py save --state .online-artifacts/online_state.json
      - name: Export forecast without changing collector data
        env:
          ONLINE_READY: ${{ steps.save_online.outcome == 'success' }}
          ONLINE_MODE: ${{ steps.online_mode.outputs.mode }}
        run: |
          if [ "$ONLINE_MODE" = "production" ]; then
            test "$ONLINE_READY" = "true"
          fi
          if [ "$ONLINE_READY" = "true" ]; then
            python model/phase3/export_prediction.py --state .online-artifacts/online_state.json --revision "$(git rev-parse HEAD)"
          else
            python model/phase3/export_prediction.py --revision "$(git rev-parse HEAD)"
          fi
      - name: Verify CSV is unchanged and record online integration evidence
        run: |
          git diff --exit-code -- data/parking.csv collect.py .github/workflows/collect.yml
          python model/phase3/production_evidence.py --csv data/parking.csv --state .online-artifacts/online_state.json --prediction site/data/prediction.json --out .online-artifacts/production_evidence.json
      - name: Archive production and calendar-shadow forecasts
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ github.run_id }}
          path: |
            site/data/prediction.json
            .online-artifacts/production_evidence.json
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy forecast and frontend
        id: deployment
        uses: actions/deploy-pages@v4
